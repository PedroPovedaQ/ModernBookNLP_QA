app = "speedreadify-booknlp"
primary_region = "iad"

kill_signal = "SIGTERM"
kill_timeout = 40

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[mounts]]
  source = "booknlp_data"
  destination = "/data"
  initial_size = "30GB"
  snapshot_retention = 5

[[vm]]
  size = "shared-cpu-4x"
  cpus = 4
  cpu_kind = "shared"
  memory = "8GB"

[[restart]]
  policy = "on-failure"
