name: Service tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r service/requirements-dev.txt
      - run: python -m unittest discover -s service/tests
      - run: ruff check service --select E4,E7,E9,F,I
      - run: ruff format --check service
